name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact }}, musl)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: tv-proxy-linux-amd64
          - target: aarch64-unknown-linux-musl
            artifact: tv-proxy-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-musl-cargo-

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: cargo build --release (musl static)
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify static binary
        run: file target/${{ matrix.target }}/release/tv-proxy

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/tv-proxy ${{ matrix.artifact }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: test
          draft: false
          files: ${{ matrix.artifact }}
