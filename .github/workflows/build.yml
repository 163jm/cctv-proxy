name: Build

on:
  workflow_dispatch:

jobs:
  build-gnu:
    name: Build GNU dynamic (glibc>=2.28) (${{ matrix.artifact }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu.2.28
            artifact: tv-proxy-linux-amd64-gnu

          - target: aarch64-unknown-linux-gnu.2.28
            artifact: tv-proxy-linux-arm64-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-gnu-cargo-

      - name: Install Zig
        uses: taiki-e/install-action@zig

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: cargo zigbuild --release (glibc >= 2.28, dynamic)
        run: cargo zigbuild --release --target ${{ matrix.target }} --features jemalloc

      - name: Verify glibc requirement
        run: |
          objdump -T target/${{ matrix.target }}/release/tv-proxy 2>/dev/null \
            | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -3 \
            || true

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/tv-proxy ${{ matrix.artifact }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: test
          draft: false
          files: ${{ matrix.artifact }}
